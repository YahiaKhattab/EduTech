<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduTech</title>
  <meta name="description" content="EduTech: AI-assisted assessment and learning gap detection for Grades 1–5 (CSEN 909 course project, Team #30).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Kalam&family=Patrick+Hand&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/teacher.css">
  <link rel="stylesheet" href="css/parent.css">
</head>
<body>
  <div id="app"></div>
  <noscript>EduTech needs JavaScript to run.</noscript>

  <!-- Shared state (the same for all three views) -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>

  <!-- UI building blocks -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/format.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/router.js"></script>
  <script src="js/ui/progress.js"></script>

  <!-- Student view (part 1) -->
  <script src="js/views/student/home.js"></script>
  <script src="js/views/student/upload.js"></script>
  <script src="js/views/student/tracker.js"></script>
  <script src="js/views/student/results.js"></script>
  <script src="js/views/student/progress.js"></script>

  <!-- Teacher view (part 2) -->
  <script src="js/views/teacher/shared.js"></script>
  <script src="js/views/teacher/home.js"></script>
  <script src="js/views/teacher/verify.js"></script>

  <script src="js/views/teacher/review-questions.js"></script>
  <script src="js/views/teacher/review-gaps.js"></script>
  <script src="js/views/teacher/review-history.js"></script>
  <script src="js/views/teacher/gaps.js"></script>

  <!-- Parent view (part 3) -->
  <script src="js/views/parent/shared.js"></script>
  <script src="js/views/parent/home.js"></script>
  <script src="js/views/parent/results.js"></script>
  <script src="js/views/parent/progress.js"></script>

  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>

</html>
